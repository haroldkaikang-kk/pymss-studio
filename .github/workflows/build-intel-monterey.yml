name: Build Intel Monterey App

on:
  push:
    branches: [intel-monterey]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-monterey-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
          run_install: false
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Rust target
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Build patched engine wheels
        run: bash scripts/build-intel-engine-wheels.sh
      - name: Prepare bundled Python engine
        run: python3 scripts/prepare-intel-runtime.py
      - name: Prepare Monterey audio tools
        run: bash scripts/prepare-intel-tools.sh
      - name: Build Intel app
        run: bash scripts/build-intel-macos.sh build
      - name: Verify and package Intel app
        run: bash scripts/build-intel-macos.sh verify
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-Intel-Monterey
          path: intel-build/Pymss-Studio-Intel-Monterey-candidate.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-build-diagnostics
          path: |
            intel-build/macos-binary-audit.json
            intel-build/audio-tools-audit.json
            intel-build/bundled-models.jsonl
          if-no-files-found: ignore
          retention-days: 14
